{% extends "base.html" %}

{% block title %}Register Analyst | Bluetooth Security Platform{% endblock %}

{% block auth_content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.8rem;">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h4 class="text-white fw-bold mb-1">New Analyst Registration</h4>
            <p class="text-muted small">Provision Security Assessment Credentials</p>
        </div>

        <div class="cyber-card p-4">
            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="mb-3">
                    <label class="form-label text-light small">Analyst Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person-badge"></i></span>
                        <input type="text" name="username" class="form-control cyber-input" placeholder="e.g. security_auditor" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-light small">Enterprise Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control cyber-input" placeholder="analyst@domain.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-light small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control cyber-input" placeholder="Min. 6 characters" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-light small">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-shield-check"></i></span>
                        <input type="password" name="confirm_password" class="form-control cyber-input" placeholder="Repeat password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-cyber-primary w-100 py-2 mt-2">
                    <i class="bi bi-person-check me-2"></i>Create Security Profile
                </button>
            </form>
        </div>

        <div class="text-center mt-3">
            <span class="text-muted small">Already have credentials?</span>
            <a href="{{ url_for('auth.login') }}" class="text-info small fw-medium ms-1">Return to Login</a>
        </div>
    </div>
</div>
{% endblock %}
